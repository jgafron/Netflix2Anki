[Settings]
font_size = 17
ocr_language = tha
api_key = YOUR_API_KEY
openai_prompt = You are a helpful assistant. Your task is to translate Thai text into English and provide a word-by-word breakdown including tones and definitions.
user_openai_prompt = Translate the following into English, then break it down word for word. Include tone marks in the phonetics and provide the English definition of each word. The response should be formatted as:
	
	Rephrased in English: "<Translation>"
	Breaking it down:
	<word> (<phonetic>): <definition>
	
	{prompt_text}
model = gpt-4

